<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Speech Recognition Challenge 2026 팀별 프로젝트">
  <title>Speech Recognition Challenge 2026</title>
  <style>
    :root{color-scheme:light;--paper:#f5f6f1;--white:#fff;--ink:#19332f;--muted:#64716b;--green:#246b56;--pale:#edf3ed;--line:#dce2da}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Segoe UI","Malgun Gothic",sans-serif;word-break:keep-all}
    a{color:inherit;text-underline-offset:4px}
    button,input{font:inherit}
    a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #b9791b;outline-offset:4px}
    .skip{position:absolute;left:20px;top:-100px;padding:10px;background:var(--white);z-index:10}.skip:focus{top:12px}
    .wrap{width:min(1160px,calc(100% - 80px));margin:auto}
    header{border-top:5px solid var(--green);border-bottom:1px solid var(--line);background:var(--white)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:82px}
    .brand{display:flex;align-items:center;gap:13px;text-decoration:none;font-weight:700;line-height:1.35}
    .brand-mark{width:46px;height:46px;display:block;object-fit:contain;flex-shrink:0}
    .brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.08em;margin-top:3px}
    .repo-link{font-size:13px;color:var(--muted);white-space:nowrap}
    .hero{padding:54px 0 34px;display:flex;justify-content:space-between;align-items:flex-end;gap:28px}
    .eyebrow{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.12em;margin:0 0 14px}
    h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.045em;line-height:1.22;margin:0 0 14px;font-weight:750}
    .intro{color:var(--muted);margin:0;max-width:620px;font-size:15px}
    .project-total{margin:0 0 3px;flex-shrink:0;display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:12px}
    .project-total strong{font-size:44px;line-height:1;font-weight:500;letter-spacing:-.05em;color:var(--green)}
    .tools{padding:22px 0;display:flex;justify-content:space-between;align-items:center;gap:18px;border-top:1px solid var(--line)}
    .search{position:relative;width:min(510px,100%)}
    .search svg{position:absolute;left:15px;top:16px;color:var(--muted);pointer-events:none}
    .search input{width:100%;height:50px;border:1px solid #cdd6cb;border-radius:6px;background:var(--white);padding:0 42px;color:var(--ink)}
    .search input::placeholder{color:#7c8780}
    .search input:focus{border-color:var(--green)}
    .clear-search{position:absolute;right:7px;top:7px;width:36px;height:36px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:4px;font-size:20px}
    .result-count{margin:0;color:var(--muted);font-size:12px;white-space:nowrap}
    .directory{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    thead{background:#eaf0e8}
    th{text-align:left;font-size:12px;color:#4c6155;font-weight:600;padding:14px 22px;border-bottom:1px solid var(--line)}
    th:first-child{width:92px}th:nth-child(3){width:206px}th:last-child{width:160px;text-align:right}
    td{padding:24px 22px;border-bottom:1px solid #e7ebe4;vertical-align:middle}
    tbody tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#fafbf8}
    .team-number{font-size:23px;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;font-weight:450;color:var(--green)}
    .team-label{display:block;font-size:10px;letter-spacing:.1em;color:#758477;margin-bottom:8px}
    .project-title{margin:0;font-size:17px;font-weight:650;line-height:1.45;letter-spacing:-.025em}
    .description{color:var(--muted);font-size:12px;line-height:1.65;margin:7px 0 0;max-width:590px}
    .members{font-size:13px;color:#4b5e53;line-height:1.9}
    .member{display:inline-block;margin-right:8px}
    .page-action{text-align:right}
    .page-link{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:40px;padding:8px 13px;border:1px solid #cbd9cd;border-radius:5px;text-decoration:none;color:var(--green);font-size:12px;font-weight:650;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
    .page-link:hover{color:var(--white);background:var(--green);border-color:var(--green)}
    .page-link span{font-size:17px;line-height:1}
    .empty{padding:54px 24px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:8px}
    .pending{margin:22px 0 0;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:22px}
    .pending summary{cursor:pointer;display:list-item;width:fit-content}
    .pending ul{display:flex;flex-wrap:wrap;gap:8px 28px;list-style:none;padding:15px 0 0;margin:0}
    .pending b{font-weight:600;color:#4d6255;margin-right:7px}
    footer{display:flex;justify-content:space-between;gap:20px;margin:0 auto;padding:24px 0 38px;color:#748176;font-size:11px}
    footer p{margin:0}footer a{color:#526b59}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    [hidden]{display:none!important}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    @media(max-width:900px){.wrap{width:calc(100% - 40px)}th:nth-child(3){width:152px}th:first-child{width:74px}th:last-child{width:139px}th,td{padding-left:16px;padding-right:16px}.description{font-size:11px}.project-title{font-size:16px}}
    @media(max-width:640px){.wrap{width:calc(100% - 32px)}.header-inner{min-height:72px;gap:10px}.brand{font-size:13px;gap:9px}.brand small{font-size:9px}.brand-mark{width:30px;height:30px;font-size:10px}.repo-link{font-size:11px}.hero{padding:34px 0 26px;align-items:flex-start}.eyebrow{font-size:10px;margin-bottom:10px}.intro{font-size:13px}.project-total{flex-direction:column;align-items:flex-end;gap:7px;padding-top:3px}.project-total strong{font-size:36px}.project-total span{font-size:10px}.tools{display:block;padding:18px 0}.result-count{margin-top:12px}.directory{border-radius:6px}table,tbody,tr,td{display:block;width:100%}thead{display:none}tbody tr{position:relative;padding:20px 18px}td{border:0;padding:0}.team-cell{display:flex;align-items:baseline;gap:7px;margin:0 0 11px}.team-label{margin:0;font-size:10px}.team-number{font-size:17px}.project-title{font-size:17px}.description{font-size:12px;margin-top:8px}.members{font-size:12px;margin-top:13px;padding-right:120px;min-height:40px;display:flex;align-items:center;flex-wrap:wrap}.page-action{position:absolute;right:18px;bottom:20px;width:auto}.page-link{min-height:38px;padding:7px 10px;font-size:11px;gap:9px}tbody tr+tr{border-top:1px solid var(--line)}footer{flex-direction:column;gap:8px;padding-bottom:28px}.pending ul{display:block}.pending li+li{margin-top:8px}}
    @media(max-width:640px){.brand-mark{width:38px;height:38px}}
  </style>
</head>

의 성능을 비교합니다.","members":[{"name":"박준형","id":"202020733"}],"filename":"Team_박준형_202020733.html","prUrl":"https://github.com/LSH-Ajou/Speech-Recognition-Challenge-2026/pull/7","repositoryUrl":"https://github.com/wnsgud6707/Korean-Dialect-Challenge"}],"pendingTeams":[{"team":5,"members":[{"name":"SHIRUIQING","id":"202322325"}]}]}</script>
  <script>
    'use strict';
    const {projects,pendingTeams}=JSON.parse(document.getElementById('project-data').textContent);
    const list=document.getElementById('project-list');
    const search=document.getElementById('search');
    const clear=document.getElementById('clear-search');
    const normalize=value=>String(value).normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,' ').trim();
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const sorted=[...projects].sort((a,b)=>(a.team??999)-(b.team??999));
    function render(){
      const query=normalize(search.value);
      const teamQuery=query.match(/^(?:team\s*)?0*(\d+)(?:\s*팀)?$/i);
      const visible=sorted.filter(project=>{
        if(!query)return true;
        if(teamQuery&&Number(teamQuery[1])<100)return project.team===Number(teamQuery[1]);
        const terms=query.split(' ');
        const text=normalize([project.title,project.description,...project.members.flatMap(member=>[member.name,member.id]),project.team==null?'개인 제출':`team ${project.team} ${project.team}팀`].join(' '));
        return terms.every(term=>text.includes(term));
      });
      list.innerHTML=visible.map(project=>`<tr><td class="team-cell"><span class="team-label">${project.team==null?'개인 제출':'TEAM'}</span><span class="team-number">${project.team==null?'—':String(project.team).padStart(2,'0')}</span></td><td><h2 class="project-title">${escapeHtml(project.title)}</h2><p class="description">${escapeHtml(project.description)}</p></td><td class="members">${project.members.map(member=>`<span class="member">${escapeHtml(member.name)}</span>`).join('')}</td><td class="page-action"><a class="page-link" href="submission/${encodeURIComponent(project.filename)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(project.title)} 프로젝트 페이지 새 탭에서 열기">페이지 열기 <span aria-hidden="true">↗</span></a></td></tr>`).join('');
      document.getElementById('empty-state').hidden=visible.length!==0;
      document.getElementById('result-count').textContent=query?`${visible.length}개 프로젝트 검색됨`:`전체 ${projects.length}개 프로젝트 · 팀 번호순`;
      clear.hidden=!query;
    }
    search.addEventListener('input',render);
    search.addEventListener('keydown',event=>{if(event.key==='Escape'){search.value='';render();}});
    clear.addEventListener('click',()=>{search.value='';render();search.focus();});
    document.getElementById('total-projects').textContent=projects.length;
    document.getElementById('pending-count').textContent=pendingTeams.length;
    document.getElementById('pending-list').innerHTML=pendingTeams.map(team=>`<li><b>${team.team}팀</b>${team.members.map(member=>escapeHtml(member.name)).join(' · ')}</li>`).join('');
    render();
  </script>
